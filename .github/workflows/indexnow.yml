name: indexnow

# After Cloudflare deploys main, tell the IndexNow search engines which pages
# changed (site/scripts/indexnow.mjs). Needs no secret: the key is public.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Each push waits for its own deploy. If a later push goes live first, the
# earlier run still pings what its build changed, as long as that build went
# live; if it never did, the later build dates those changes as its own.
concurrency:
  group: indexnow-${{ github.sha }}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history, to tell whether a later live commit contains this one.
          fetch-depth: 0
          sparse-checkout: site
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
      - name: Wait for the deploy, then ping the changed pages
        run: node scripts/indexnow.mjs "$GITHUB_SHA" --wait 2400
