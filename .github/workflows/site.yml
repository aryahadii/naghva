name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      SITE_URL: https://naghva.com
      NAGHVA_BUILD_SHA: ${{ github.sha }}
      # The licensed Persian fonts: on main from the private R2 bucket (fonts/,
      # with the R2 key below), or from NAGHVA_FONTS_URL; without either the
      # build uses the free Vazirmatn (site/scripts/fetch-fonts.mjs).
      NAGHVA_FONTS_URL: ${{ vars.NAGHVA_FONTS_URL }}
      NAGHVA_FONTS_TOKEN: ${{ secrets.NAGHVA_FONTS_TOKEN }}
      # Naghva's own image copies (site/scripts/media.mjs). Only builds of main
      # get the read-only R2 key, and they must have every image's own copy and
      # the licensed fonts. Other builds show images from their publishers.
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.R2_READ_ACCESS_KEY_ID || '' }}
      R2_SECRET_ACCESS_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.R2_READ_SECRET_ACCESS_KEY || '' }}
      NAGHVA_MEDIA_REQUIRED: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '1' || '' }}
      PUBLIC_POSTHOG_KEY: ${{ github.ref == 'refs/heads/main' && vars.PUBLIC_POSTHOG_KEY || '' }}
      PUBLIC_POSTHOG_HOST: ${{ github.ref == 'refs/heads/main' && vars.PUBLIC_POSTHOG_HOST || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r ../tools/requirements.txt
      # The build validates again inside derive; this run prints the warnings.
      - name: Test the tools and validate the data
        run: |
          python3 -m unittest discover -s ../tools -p 'test_*.py'
          python3 ../tools/validate.py
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Restore the image originals fetched by earlier builds
        id: media-cache
        uses: actions/cache/restore@v4
        with:
          path: site/media-cache
          key: media-${{ hashFiles('site/media.json') }}
          restore-keys: media-
      - name: Build from the published record
        run: npm run build
      - name: Check every address is on the committed list
        run: |
          git diff --exit-code -- addresses.json || {
            echo "::error file=site/addresses.json::New addresses aren't on the list. Run npm run derive in site/ and commit addresses.json."
            exit 1
          }
      - name: Test the site code and check types
        run: npm test && npm run check
      - name: Keep the image originals for later builds, so they read nothing from R2
        if: env.NAGHVA_MEDIA_REQUIRED == '1' && steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: site/media-cache
          key: media-${{ hashFiles('site/media.json') }}
      - name: Restore Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser flows against the production build
        run: npm run test:browser
      - name: Build from the examples
        run: npm run build:examples

