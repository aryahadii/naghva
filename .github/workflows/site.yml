name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      SITE_URL: https://naghva.com
      NAGHVA_BUILD_SHA: ${{ github.sha }}
      # This workflow checks; Cloudflare Workers Builds deploys. Only Cloudflare
      # holds the R2 read key, so these builds use the free Vazirmatn and show
      # images from their publishers (site/scripts/fetch-fonts.mjs, media.mjs).
      PUBLIC_POSTHOG_KEY: ${{ github.ref == 'refs/heads/main' && vars.PUBLIC_POSTHOG_KEY || '' }}
      PUBLIC_POSTHOG_HOST: ${{ github.ref == 'refs/heads/main' && vars.PUBLIC_POSTHOG_HOST || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r ../tools/requirements.txt
      # The build validates again inside derive; this run prints the warnings.
      - name: Test the tools and validate the data
        run: |
          python3 -m unittest discover -s ../tools -p 'test_*.py'
          python3 ../tools/validate.py
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build from the published record
        run: npm run build
      - name: Check every address is on the committed list
        run: |
          git diff --exit-code -- addresses.json || {
            echo "::error file=site/addresses.json::New addresses aren't on the list. Run npm run derive in site/ and commit addresses.json."
            exit 1
          }
      - name: Test the site code and check types
        run: npm test && npm run check
      - name: Restore Playwright's Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser flows against the production build
        run: npm run test:browser
      - name: Build from the examples
        run: npm run build:examples

