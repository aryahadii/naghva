    - source: fa.wikipedia.org-wiki-turkey
      quote: |-
        تُرکیه ، با نام رسمی جمهوری ترکیه ، یک کشور فراقاره‌ای است که بخش عمدهٔ آن در آناتولی در غرب آسیا قرار دارد و بخش کوچکی از آن در بالکان در اروپای جنوب شرقی واقع شده است.
      accessed: '2026-11-14'
