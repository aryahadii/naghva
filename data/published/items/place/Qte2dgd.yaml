id: Qte2dgd
type: place
statements:
  name:
  - value:
      text: الأهواز
      language: ar
    references:
    - source: raseef22.net-article-1087519-saki
      quote: ولد مهدي عام 1974 في الأهواز، مثّل في عدة أفلام ومسرحيات، وإلى ‏جانب موهبة التمثيل فقد مارس الغناء على طريقة "موسیقی الفیوجن" ‏ضمن فرقته الغنائية
        (كَمَاكان). يغني مهدي ‏بأسلوبه الجميل باللغتين العربية والفارسية أغانيَ فولكلورية إلى جانب قصائد عدة لجلال الدين الرومي، كما يعمل في معظم أغانيه
        على مزج الأغاني العربية ‏والفارسية بتوزيع جديد وآلات موسيقية غربية.
      accessed: '2026-11-06'
