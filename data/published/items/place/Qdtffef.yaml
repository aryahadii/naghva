      quote: |-
        اُستْرالیا با نام رسمی مشترک‌المنافع استرالیا یک کشور فراقاره‌ای است که از سرزمین اصلی قاره استرالیا، جزیره تاسمانی و جزایر کوچک‌تر متعددی تشکیل شده است.
      accessed: '2026-11-14'
