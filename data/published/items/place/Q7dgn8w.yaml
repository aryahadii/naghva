      text: سان فرانسیسکو
      language: fa
    references:
    - source: fa.wikipedia.org-wiki-arash-sobhani
      quote: |-
        آرش سبحانی زادهٔ تهران و دانش‌آموختهٔ رشتهٔ معماری از دانشگاه هنر اصفهان است. در سال ۱۳۸۵ از ایران به سان فرانسیسکو آمریکا مهاجرت کرد.
