  - value:
      text: مبهم دور
      language: fa
    references:
    - source: t.me-miladderakhshaniofficial-920-73c1be716085
      quote: |-
        آلبوم 'مبهم دور' منتشر شد
        شروع ضبط آلبوم از اواسط شيوع كرونا آغاز شد، تجربه عجيبى پر از خلوت كردن ها و سكوت و بُهت و نگرانى و نگاه به آينده مبهمى كه هنوز در ابهام خودش باقيست، حس و حال قطعات اين آلبوم يادآور خاطرات متفاوت و خاصى است كه در اين مدت تاثيرات مهمى بر افكار و بينش من چه در موسيقى و چه در نگرش به زندگى شخصى داشته
        اميدوارم از شنيدن آلبوم لذت ببريد.
        آلبوم فقط بصورت ديجيتال قابل شنيدن و خريد در تمام پلتفرم ها(اسپاتيفاى،آيتوز، اپل و…)
        عكس،طراحى كاور:
        ‏@alirezanabaee
        صدابردار
        ‏@hamidrezaadab
        دستيار صدا
        ‏@mehdibashir_
        @hosseinfelehgari
        با تشكر از مهيار طهماسبى براى همراهى در دو قطعه سوگ رود و پاييز را بخاطر بسپار
        @mahyar_tahmasbi
        (طرح جلد اتاق موسيقى عمارت عالى قاپو #اصفهان )
        با تشكر از شركت @raharecordss
        #miladderakhshani #ميلاد_درخشانى
      accessed: '2026-11-06'
  performer:
  - value: Qnjntqs
    references:
    - source: music.apple.com-us-album-mobham-e-door-1598295714-2488d357feb6
      quote: '"byArtist":[{"@type":"MusicGroup","url":"https://music.apple.com/us/artist/milad-derakhshani/324842865","name":"Milad Derakhshani"}]'
      accessed: '2026-11-06'
  - value: Qnjntqs
    references:
    - source: t.me-miladderakhshaniofficial-722-1dbff42f56be
      quote: |-
        "مبهم دور"
        آهنگساز،تار،گيتار بيس،پركاشن: ميلاد درخشانى
        ويدئو،گرافيك: عليرضا نبئى
        صدابردار: حميدرضا آداب
        دورى كه نيامده و ابهامى كه هر روز بيشتر و بيشتر ميشود و زندگيمان را مه آلود به جلو مى راند و نگاه به دور را ناممكن، بهتر است همين نزديكى را ديد،لحظه را يافت ،خوش بود و رقصيد.
        تشكر بسيار از دوست عزيزم عليرضا نبئى و همراهى و كمك هميشگى اش
      accessed: '2026-11-06'
    qualifiers:
      role: tar
