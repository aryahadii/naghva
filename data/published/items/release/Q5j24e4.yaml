statements:
  name:
  - value:
      text: غواص
      language: fa
    references:
    - source: soundcloud.com-kamakan-the-diver
      quote: |-
        the diver – غوآص
        by
        Kamakan
        published on
        2026-08-08T13:56:29Z
        به نام خدآ

        سالهاست و
        کماکآن
        مرآ عهدی ست با شآدی
        که شآدی آنِ من باشد...
        غوّاص امّا
        غم نامه ایست
        برای ِ جهانِ الانِ مآن،
        از ونکوور تا تهران...
        هشداری ست به  مردمِ خوبِ باقیمانده
        (و حتی آنها که بدی می‌کنند!) از سرزمینی که
        شهرِ یاران بود و خاکِ مهربانآن!

        وصفِ حالِ ماست،
         به جهانِ اَلان که
        قشنگ نیست!

        وما
        هنوز  زنده آییم
        و
        امید داریم❤️

        _____________
        غَوّآص
        The Diver...

        جمع آوری و تنظیم
        مهدی ساکی ،سآم مظاهری
        Composed&Arranged
        Mahdi Saki,Sam Solino

        شعر
        حسین جنتی
        Songwriter
        Hossein Jannati

        ضبط و مسترینگ
         Recording and mastering
        Andy Schichter
        Park Sound Studio Vancouver

        موشن گرافی
