    - source: taz.de-eine-ode-an-die-trucker-des-iran-5487473-f3d8de8f4e4a
      quote: '„Es ist das erst Mal, dass ich alles selbst gemacht habe, von der Aufnahme zur Produktion. Nur das Cover hat ein Freund gestaltet“, erzählt Ashgvari, und ergänzt: „Für dieses Album habe ich keinen Song geschrieben. Ich habe alte Songs und Gedichte verwendet, zusammengeschnitten und manchmal die Lyrics verändert.“'
      accessed: '2026-11-06'
