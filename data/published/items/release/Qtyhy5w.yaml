statements:
  name:
  - value:
      text: راه ابریشم
      language: fa
    references:
    - source: t.me-arashfouladvand-387
      quote: 🎵 دوستان عزیزم آلبوم "راه ابریشم " با تکخوانی خانم دریا دادور، و همراهی گروه کر بهار و ارکستر فیلارمونیک پاریس شرقی در ایران( تهران و سایر شهرستان ها) قابل دسترسی است. جهت تهیه و کسب اطلاعات بیشتر با آیدی زیر در تلگرام( لطفا تماس تلفنی نگیرید) در ارتباط باشید 👇 @masoudi14
      accessed: '2026-11-21'
      locator: Conductor’s original caption
