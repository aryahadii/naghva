statements:
  name:
  - value:
      text: حرمان
      language: fa
    references:
    - source: t.me-sahbamusic-738
      quote: قطعه "حرمان" صهبا مطلبي، در آواز بيات اصفهان- اين قطعه همزمان با بازي هاي كودكانه فرزندانمان ليلي و
        شيرين ساخته شده است. فضاهاي شيطنت  آميز و پر هياهوي كودكانه آنها در اعماق اين آهنگ در لحظه به لحظه "حرمان"
        پراكنده شده اند. ☺️ تار دسترنج استاد رامين جزايري
      locator: Original programme, artist or edition credits
      accessed: '2026-11-21'
