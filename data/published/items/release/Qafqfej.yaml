    references:
    - source: www.womex.com-virtual-eastgah_music-bomrani-d400fc179406
      quote: Bomrani was founded in 2008 by Behzad Omrani (singer and guitar player). After working
        as a solo artist (using “Bomrani” as his stage name) and recording Yellow Sky, Blue Sun in
        2010, Mani Mozaka (harmonica and trumpet) and Jahanyar Ghorbani (electric guitar) joined
        him. The Bomrani trio gave several experimental performances in smaller venues before Arash
        Omrani (keyboards), Kiarash Omrani (bass) and Abtin Yaghmaeian (drums) joined them. The songs
        they wrote before 2011 were collected in an album called Naked Socks. After performing in
        various charity shows in 2012, they gradually started to gain momentum and were recognized
        by various cultural circles, which led to several collaborations with reputable Iranian theater
        directors. They were cherished as the most hard-working band in theater music in 2012 by
        the public relations of the prestigious City Theater of Tehran. In 2012, they were commissioned
        by Chekeh Records to make a children’s album. The favorite Red Bus was the result, released
        on June 2014.
      accessed: '2026-11-06'
