  published by:
  - value: Qfjdpk8
    references:
    - source: worldmusiccentral.org-vas-vocalist-azam-ali-releases-elysium-for-the-brave-c8313e75ae41
      quote: "Elysium for the Brave (Six Degrees Records), Azam Ali’s second solo album, signals a new turn in her musical evolution. The album, her most ambitious work to date, brings together musicians from varied musical backgrounds performing in diverse permutations. Singing predominantly in English for the first time, the songs are based on lyrics written by Azam herself and reveal a poetic lyricism heard only in glimpses of her previous works. "
      accessed: '2026-11-06'
