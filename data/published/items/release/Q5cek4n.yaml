      quote: ، گروه پالت پس از مدتی سکوت خبری، در آستانه سال جدید، با چند سورپرایز به دیدار دوستدارانش می‌رود که اولین آن‌ها مجموعه‌ای شامل اولین کنسرت تصویری گروه و یک آلبوم EP با نام "تمام ناتمام" است که امروز سه‌شنبه 10 اسفندماه منتشر و در سراسر کشور توزیع شد.
