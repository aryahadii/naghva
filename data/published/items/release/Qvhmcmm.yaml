id: Qvhmcmm
type: release
statements:
  name:
  - value:
      text: قسمت هایی از تکنوازی سنتور و قطعاتی که به عنوان آهنگساز و نوازنده‌ی میهمان در کنسرت گروه
      language: fa
    references:
    - source: t.me-soheilhosnavi-450
      quote: قســمت هـــایی از تکنـــوازی سنتـــور و قطعـــاتی که به عنــوان آهنگســاز و نـوازنـــده‌ی میهمــان
        در کنسـرت گـروه سـازهای کـوبه ای اشــاره اجرا کـردم
      locator: Artist channel, original post 450
      accessed: '2026-11-21'
