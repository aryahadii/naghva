      quote: |-
        امیرحسین طباطبایی تهیه کننده این آلبوم است، علی اوجی مدیریت پروژه را بر عهده داشته و علیرضا نبئی مدیر هنری کار است. این آلبوم توسط انتشارات «آوای سوته دلان» منتشر شده و توسط شرکت پخش «جوان» در فروشگاه‌های محصولات فرهنگی سرتاسر کشور عرضه شده است.
