      quote: |-
        قطعات این آلبوم بر اساس اشعاری از مهدی اخوان ثالث‌، شفیعی کدکنی‌، فروغ فرخزاد‌، هوشنگ ابتهاج‌، فصیح الزمان شیرازی‌، کیان پورتراب‌ و علیرضا داوری‌ آهنگسازی شده‌اند.
