  - value: Qm7dsfg
    references:
    - source: www.sixdegreesrecords.com-azam-ali-0e26b59ce57d
      quote: 'Azam Ali’s voice is part of a rich texture that includes drones from Carmen Rizzo and various Middle Eastern lutes played by Loga Ramin Torkian. Both are her bandmates in Niyaz, the international world music ensemble they founded in 2005, and more to the point, Torkian is her husband and the father of Iman. Rounding out the ensemble are leading musicians from the Turkish, Iranian, Kurdish and Arab traditions as well as the Bozzini String Quartet from Montreal. Some of the languages may be unfamiliar: the trancey “Mehman,” with Ali’s voice soaring over a wash of electronics as a slow drumbeat chants in the background, is sung in the dialect of Sirjan, Iran. The simple, childlike melody of “Lai Lai” uses a text from the Sorani dialect of Iraqi Kurdistan. '
      accessed: '2026-11-06'
    qualifiers:
      role: vocals
