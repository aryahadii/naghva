statements:
  name:
  - value:
      text: از خاک
      language: fa
    references:
    - source: www.nogaam.com-sites-default-files-avazhaye-20zirzamin-209781909641020.epub-fid-1751-12a30296a291
      quote: |-
        در سال‌های 1378 تا 1380 اولین آلبوم خود را با عنوان از خاک در استودیوی معروف «بم» تهیه و ضبط کردند. آلبومی که هیچ‌وقت به طور رسمی منتشر نشد اما دست به دست در زیرزمین‌ها و بعدها در شبکه‌های مجازی اینترنت منتشر شد.
      accessed: '2026-10-19'
      locator: فصل نهم، بخش سرخس (OEBPS/Text/Section0015.xhtml)
