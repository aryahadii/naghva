  - value:
      text: در من برو شکار
      language: fa
    references:
    - source: www.honaronline.ir----5-134547-346d79b35972
      quote: دومین آلبوم گروه ما "در من برو شکار" نام دارد که به احتمال خیلی قوی تا آخر فصل بهار منتشر می‌شود. این آلبوم با همراهی قنبر راستگو ساخته شده است و ابراهیم منصفی، احسان گودرزی و محمود طلوعی شاعران کار هستند.
      accessed: '2026-10-23'
