  - value:
      text: رفته از دست
      language: fa
    references:
    - source: khmohamad.wordpress.com-category-comment-band-50da97edd8a4
      quote: |-
        گروه کامنت در سال 1386 با آشنایی «کیان پورتراب»(خواننده) و «نیما رمضان»(گیتار) شکل گرفت. بعد از مدتی با اضافه شدن «بردیا امیری»(درامز) و سپس «آرین کشیشی»(باس) و در نهایت «اشکان ابرون»(کیبورد) گروه کار خود را به صورت جدی تر پی گرفت. «کامنت» تا کنون دو آلبوم در سال های 1388 و 1390 با عنوان های «میرم بالاتر» و «دایره‌ها» در فضای مجازی منتشر کرده است. «رفته از دست» عنوان سومین آلبوم این گروه راک ایرانی است که در اردیبهشت سال جاری با مجوز وزارت ارشاد منتشر شده است. آنچه که می خوانید، نگاه کوتاهی به سومین آلبوم این گروه راک ایرانی است.
      accessed: '2026-10-20'
