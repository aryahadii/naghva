      quote: 'خونِ ارغوان‌ها ملودی: برگرفته از تصنیف "نوای چوپان" شاعر: سعید سلطان‌پور تنظیم‌کننده و رهبر ارکستر: مهرداد برآن اجرا: ارکسترِ پاریسِ شرقی و گروهِ کُر بهار'
