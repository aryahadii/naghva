  - value:
      text: Specifically, what inspired me most was learning Persian folk music from Kordestan, Azerbaijan,
        and Mazandaran.
      language: en
    references:
    - source: www.trialanderrorcollective.com-interviews-this-is-tehran-artists-of-i-0ce3998316af
      quote: I’ve always liked singing in different languages and enjoyed the folk music of Iran. Specifically,
        what inspired me most was learning Persian folk music from Kordestan, Azerbaijan, and Mazandaran.
      accessed: '2026-11-26'
  - value:
      text: My hesitations even delayed me from getting involved with music at all.
      language: en
    references:
    - source: www.trialanderrorcollective.com-interviews-this-is-tehran-artists-of-i-0ce3998316af
      quote: I was familiar with the limitations and difficulties from the day I started thinking about
        working in music. My hesitations even delayed me from getting involved with music at all.
      accessed: '2026-11-26'
