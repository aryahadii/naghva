  - value:
      text: 'حسین علیزاده، موسیقیدان، آهنگساز و نوازنده تار، یکشنبه ۳۱ خرداد در مراسمی در خانه هنرمندان
        ایران در تهران در مورد صدور حکم شلاق برای پرستو احمدی، خواننده، و هشت نفر دیگر از دست‌اندرکاران
        «کنسرت کاروانسرا» گفت: «متاسفانه در روزی حرف می‌زنم که یک تعداد از هنرمندان ما محکوم به شلاق شدند؛
        یعنی عصر حجر جلوی چشم ماست.»'
      language: fa
