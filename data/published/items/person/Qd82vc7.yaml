type: person
statements:
  name:
  - value:
      text: آیدین ترکیان
      language: fa
    references:
    - source: donya-e-eqtesad.com-3347377-chaartaar
      quote: آلبوم «دریا کجاست» شامل ۱۰ قطعه است و رضا عسگرزاده به عنوان نوازنده دودوک و آیدین ترکیان هم به‌عنوان نوازنده کمانچه در کنار اعضای گروه «چارتار» یعنی آرش فتحی (آهنگساز)، احسان حائری (شاعر)، آیین احمدی‌فر (تنظیم‌کننده) و آرمان گرشاسبی (خواننده) حضور داشته‌اند.
      accessed: '2026-11-06'
