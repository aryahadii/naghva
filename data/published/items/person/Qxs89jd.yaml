    references:
    - source: shows.acast.com-cozornershow-episodes-corner-83-kian-pourtorab-210b5f708d84
      quote: |-
        آقای «کیان پورتراب» موزیسین، آهنگساز، ترانه‌سرا، تنظیم‌کننده و خواننده‌ی آلترناتیو راک و پاپ، مهمان این قسمت از پادکست تصویری «کوزی کرنر» هستند؛
      accessed: '2026-10-20'
  member of:
  - value: Qec3sv6
    references:
    - source: www.honaronline.ir-d8-a8-d8-ae-d8-b4--d9-85-d9-88-d8-b3-db-8c-d9-82-db-8c-5-135306--d8-ac-d8-b1-d9-82-d9-87--d-66d84681229f
      quote: |-
        کامنت یا کامنت بند گروه موسیقی آلترناتیو راک ایرانی است که سال 86 توسط کیان پورتراب و نیما رمضان در تهران شکل گرفت. بعدتر با اضافه شدن سایر اعضا تعدادی از آهنگ‌های ساختهٔ کیان ضبط و سرانجام سال 88 آلبوم اول گروه با عنوان "میرم بالاتر" منتشر شد. کیان پورتراب (خواننده و ترانه سرا)، نیما رمضان (گیتار الکتریک)، بردیا امیری (درامز)، اشکان آبرون (کیبورد) و آرین کشیشی (گیتار بیس) اعضای گروه کامنت هستند.
      accessed: '2026-10-20'
