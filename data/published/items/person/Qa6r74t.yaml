  - value:
      text: کسری سبکتگین
      language: fa
    references:
    - source: www.honaronline.ir-d8-a8-d8-ae-d8-b4--d9-85-d9-88-d8-b3-db-8c-d9-82-db-8c-5-159504--da-af-d8-b1-d9-88-d9-87--d-14b5fffbc707
      quote: کاوه صالحی (گیتار)، مهیار طهماسبی (ویلنسل) و امید نعمتی (خواننده) اعضای اصلی گروه موسیقی پالت در کنار ماکان اشگواری (خواننده قطعه «این ماجرا»)، امین طاهری (درامز)، کسری سبکتگین (باس) و سردار سرمست (کیبورد) در آلبوم «نصف‌النهار مبدأ» این گروه را همراهی کرده‌اند.
      accessed: '2026-11-06'
