  - value:
      text: او پس از انتخابات ۱۳۸۸، ایران را ترک کرد و اکنون ساکن شهر مونتریال در کاناداست.
      language: fa
    references:
    - source: www.radiozamaneh.com-169959
      quote: او پس از انتخابات ۱۳۸۸، ایران را ترک کرد و اکنون ساکن شهر مونتریال در کاناداست.
      accessed: '2026-11-13'
      locator: Article paragraph 2
  - value:
      text: یک بار هم این کار را انجام دادم ولی از نتیجه کار اصلاً راضی نبودم و خوشم نمی‌آمد نمی‌خواستم که آلبوم
        را آن شکلی منتشر کنم. اصلاً راهی نداشت و تنها راهی که برایم باقی مانده بود این بود که از مردم کمک بخواهم.
        و در نهایت هم مردم آن قدر با محبت حمایت کردند و واقعاً ممکن شد که بتوانم این آلبوم را درست کنم.
      language: fa
    references:
    - source: www.radiofarda.com-a-marjan-farsad-on-her-new-album-derakht-e-sepid-30723644.html-4bffd3f5cc32
      quote: یک بار هم این کار را انجام دادم ولی از نتیجه کار اصلاً راضی نبودم و خوشم نمی‌آمد نمی‌خواستم که آلبوم
        را آن شکلی منتشر کنم. اصلاً راهی نداشت و تنها راهی که برایم باقی مانده بود این بود که از مردم کمک بخواهم.
        و در نهایت هم مردم آن قدر با محبت حمایت کردند و واقعاً ممکن شد که بتوانم این آلبوم را درست کنم.
      accessed: '2026-11-13'
    qualifiers:
      about: Qcx9xbd
  - value:
      text: وقتی آدم با افراد خیلی حرفه‌ای کار می‌کند، تجربه خیلی خوبی است. به خاطر این که این آدم‌ها آنقدر با استعداد
        و توانا هستند و آنقدر خودشان ایده می‌آورند در کار که قشنگ بخشی از کار می‌شوند. یعنی یک قسمت عمده‌ای از این
        آلبوم، ایده‌های آن آدم‌هاست که با خودشان آوردند در کار. و این خیلی ارزشمند است برای من.
      language: fa
    references:
    - source: www.radiofarda.com-a-marjan-farsad-on-her-new-album-derakht-e-sepid-30723644.html-4bffd3f5cc32
      quote: وقتی آدم با افراد خیلی حرفه‌ای کار می‌کند، تجربه خیلی خوبی است. به خاطر این که این آدم‌ها آنقدر با
