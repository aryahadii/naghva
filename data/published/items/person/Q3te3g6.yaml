        از این آلبوم، ایده‌های آن آدم‌هاست که با خودشان آوردند در کار. و این خیلی ارزشمند است برای من.
      accessed: '2026-11-13'
    qualifiers:
      about: Qcx9xbd
  - value:
      text: But their cases compelled me to speak out, and I felt like I really had to do something about their
        unjust imprisonments, even if only just writing a song.
      language: en
    references:
    - source: iranhumanrights.org-2021-08-qa-with-musician-marjan-farsad-my-hope-is-for-all-political-prisoners-to-be-freed-7c05d15f6e4e
      quote: I don’t usually talk about politics in my work. But their cases compelled me to speak out, and I felt
        like I really had to do something about their unjust imprisonments, even if only just writing a song.
      accessed: '2026-11-13'
