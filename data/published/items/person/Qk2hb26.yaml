  - value:
      text: بهزاد عمرانی
      language: fa
    references:
    - source: www.honaronline.ir-news-109586
      quote: 'بهزاد عمرانی خواننده و نوازنده گیتار ریتم، مانی مزکی نوازنده سازدهنی، جهانیار قربانی
        نوازنده گیتار الکتریک، آرش عمرانی نوازنده پیانو و کیبورد و کیارش عمرانی نوازنده گیتار بیس
        اعضای گروه بمرانی هستند که در ادامه گفت‌وگو آن‌ها را در هنرآنلاین می‌خوانید:'
      accessed: '2026-11-06'
