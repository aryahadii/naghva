  - value:
      text: ما باهم جمع می‌شویم و سر یک ملودی باهم توافق می‌کنیم، موزیکی را باهم می‌سازیم بعضی اوقات کاوه صالحی یک ملودی می‌آورد، امید نعمتی یک شعر می‌آورد و با هم آن را پرورش می‌دهیم.
