  - value:
      text: مصباح قمصری
      language: fa
    references:
    - source: www.mehrnews.com-news-4009638-fab869cfc58c
      quote: مصباح قمصری و میلاد درخشانی هر ۲ آهنگسازانی هستند که پیش از این تقریبا تمام سازهای آثارشان را خودشان می‌نواختند اما اینبار در آلبوم «نقطه پرگار» به هم نوازی در فضایی پرداخته‌اند که به گفتهٔ قمصری، موسیقی آینده ایران است. در این اثر درخشانی به آهنگسازی و نوازندگی تار پرداخته و قمصری قطعات را برای «بم‌کمان» و سازهای کوبه‌ای تنظیم و اجرا کرده است.
      accessed: '2026-11-06'
