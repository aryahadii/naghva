      accessed: '2026-11-09'
  - value:
      text: در سن پانزده سالگی گیتار را که همواره ساز مورد علاقه اش بود برگزید
      language: fa
    qualifiers:
      point in time:
        date: 1961~
    references:
    - source: www.kourosh-yaghmaei.com-biography-biography-p.htm-31cb055dbf0f
      quote: |-
        در سن پانزده سالگی گیتار را که همواره ساز مورد علاقه اش بود برگزید و پس از مدتی در گروه های موسیقی راک که خود تشکیل داده بود سرپرستی ارکستر و نوازندگی لید گیتار را به عهده داشت.
      accessed: '2026-11-09'
  - value:
      text: they dubbed their group The Raptures and played songs by their favorite garage rock and British Invasion bands.
      language: en
    references:
    - source: www.vice.com-en-article-from-national-star-to-enemy-of-the-state-iranian-rock-pioneer-kourosh-yaghmaei-fights-on
      quote: |-
        Listening to vinyl imports of bands like Washington surf-rockers The Ventures, they dubbed their group The Raptures and played songs by their favorite garage rock and British Invasion bands.
      accessed: '2026-11-09'
  - value:
      text: Later he formed a band with his brothers
      language: en
    references:
    - source: www.vice.com-en-article-from-national-star-to-enemy-of-the-state-iranian-rock-pioneer-kourosh-yaghmaei-fights-on
      quote: |-
        Later he formed a band with his brothers, and by the time he was in his early 20s, Yaghmaei was rising up on the national pop charts with ballads like “Gole Yakh,” a melancholic hit from 1973 about a love that endures through the bitterest winters.
      accessed: '2026-11-09'
