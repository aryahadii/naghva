  - value:
      text: Barred from releasing records, traveling, and performing live, he was ordered to repeatedly report to the newly established Revolutionary Courts
      language: en
    qualifiers:
      point in time:
        date: 1979~
    references:
    - source: www.vice.com-en-article-from-national-star-to-enemy-of-the-state-iranian-rock-pioneer-kourosh-yaghmaei-fights-on
      quote: |-
        According to Yaghmaei, when the new regime came in, the authorities swiftly shut down the music. Barred from releasing records, traveling, and performing live, he was ordered to repeatedly report to the newly established Revolutionary Courts, where alleged opponents of the regime were tried and sometimes put to death.
      accessed: '2026-11-09'
  - value:
      text: For the first several years after the revolution he says he also reported to Evin prison
      language: en
    references:
    - source: www.vice.com-en-article-from-national-star-to-enemy-of-the-state-iranian-rock-pioneer-kourosh-yaghmaei-fights-on
      quote: |-
        For the first several years after the revolution he says he also reported to Evin prison, a notorious detention center in northwest Tehran that has its own section for political prisoners.
      accessed: '2026-11-09'
  - value:
      text: او در این مدت ابتدا در زمینه داستان های کودکان (کتاب و نوار) و ارائه آلبوم دیار (ارکستراسیون آواهای محلی ایران برای ارکستر بزرگ بدون آواز) و در ادامه با تدریس گیتار زندگی را میگذرانید.
      language: fa
    references:
    - source: www.kourosh-yaghmaei.com-biography-biography-p.htm-31cb055dbf0f
      quote: |-
        او در این مدت ابتدا در زمینه داستان های کودکان (کتاب و نوار) و ارائه آلبوم دیار (ارکستراسیون آواهای محلی ایران برای ارکستر بزرگ بدون آواز) و در ادامه با تدریس گیتار زندگی را میگذرانید.
      accessed: '2026-11-09'
  - value:
      text: او پس از سال‌ها ممنوعیت فعالیت در زمینه موسیقی، در سال ۱۳۷۳ با انتشار آلبوم «سیب نقره‌ای» دوباره به عرصه موسیقی برگشت.
      language: fa
    qualifiers:
      point in time:
        date: '1373'
        calendar: jalali
    references:
    - source: www.bbc.com-persian-articles-c20gwqdz2xro
      quote: |-
        او پس از سال‌ها ممنوعیت فعالیت در زمینه موسیقی، در سال ۱۳۷۳ با انتشار آلبوم «سیب نقره‌ای» دوباره به عرصه موسیقی برگشت.
      accessed: '2026-11-09'
  - value:
      text: First, Yaghmaei says, he was forbidden from putting his face on the album’s cover.
      language: en
    references:
    - source: www.vice.com-en-article-from-national-star-to-enemy-of-the-state-iranian-rock-pioneer-kourosh-yaghmaei-fights-on
      quote: |-
        First, Yaghmaei says, he was forbidden from putting his face on the album’s cover. Then, when he finished Malek Jamshid, he waited over a decade to hear back from the Ministry of Culture and Islamic Guidance about a release permit.
      accessed: '2026-11-09'
  - value:
      text: It took two years for Yaghmaei to finish the album, working with a limited budget and whatever equipment he had on hand.
      language: en
    references:
    - source: www.vice.com-en-article-from-national-star-to-enemy-of-the-state-iranian-rock-pioneer-kourosh-yaghmaei-fights-on
      quote: |-
        It took two years for Yaghmaei to finish the album, working with a limited budget and whatever equipment he had on hand. But it took another 12 years to release it, as he struggled with government authorities to obtain the required permit to have it released. Malek Jamshid was finally released this summer—without the permit—on a small label based out of Los Angeles.
      accessed: '2026-11-09'
  - value:
      text: آلبوم «ملک جمشید» من که مجوز تمام مراحل ممیزی شعر و موزیک و … را گرفته بود به ناگاه جلوی پخش آن گرفته شد.
      language: fa
    references:
    - source: www.kaleme.com-1392-08-11-klm-163498
      quote: |-
        و نتیجه اینکه بر پایه این حکم آلبوم «ملک جمشید» من که مجوز تمام مراحل ممیزی شعر و موزیک و … را گرفته بود به ناگاه جلوی پخش آن گرفته شد.
      accessed: '2026-11-09'
  - value:
      text: 'Highland Park’s Now Again label has compiled “Back From the Brink: Pre-Revolution Psychedelic Rock From Iran: 1973-1979,”'
      language: en
    qualifiers:
      point in time:
        date: '2011'
    references:
    - source: www.latimes.com-archives-la-xpm-2011-aug-21-la-ca-iranian-rock-reissues-20110821-story.html
      quote: |-
        Highland Park’s Now Again label has compiled “Back From the Brink: Pre-Revolution Psychedelic Rock From Iran: 1973-1979,” one of the most cohesive compilations from Iran’s own guitar hero, Kourosh Yaghmaei.
      accessed: '2026-11-09'
  - value:
      text: Kourosh now runs a private music school and studio in Tehran
      language: en
    qualifiers:
