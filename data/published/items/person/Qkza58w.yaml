  - value:
      text: Kourosh Yaghmaei
      language: en
    references:
    - source: kouroshyaghmaei.bandcamp.com-album-back-from-the-brink-c58e0bf6d3b0
      quote: |-
        Kourosh Yaghmaei and his brothers Kamran and Kambiz were amongst the few inspired Iranian musicians determined to change Tehran’s musical landscape in the late 60’s and early 70’s. The trio, armed with rented, second-hand instruments and records by The Ventures, The Kinks, The Doors, merged Western garage rock, psychedelia and Iranian folkloric music to create a sound unlike anything that came before them.
      accessed: '2026-10-19'
