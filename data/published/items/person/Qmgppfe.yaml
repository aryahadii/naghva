    references:
    - source: iranianmusiciansunion.com-peter-soleimanipour-obituary
      quote: |-
        در همان سال به اتفاق علی فروردین، مهراب مقدسیان و عین‌الله کیوان‌شکوه «پرسیکو کوارتت‌» را شکل دادند تا با اجرای قطعاتی از تاریخ موسیقی جاز، این موسیقی را تجربه کنند.
      accessed: '2026-10-19'
  - value: Q2vrwdj
    references:
    - source: iranianmusiciansunion.com-peter-soleimanipour-obituary
      quote: |-
        در سال ۱۳۸۴«آنسامبل پیتر سلیمانی‌پور» را شکل داد که هنرمندانی چون ماهان میرعرب، پیتر آکوپ، حبیب مفتاح بوشهری، آرش پشند مقدم، دارا دارایی، آیدا نصرت، امین طاهری و میثم مروستی آذین‌بخش اجراهای مختلف این گروه از ساخته‌های سلیمانی‌پور بودند.
      accessed: '2026-10-19'
