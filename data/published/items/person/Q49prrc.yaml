    references:
    - source: qantara.de-en-article-interview-iranian-percussionist-habib-meftah-analogue-electrofolk-southern-iran
      quote: It refers to my origins in the southern Iranian town of Bushehr, and thatʹs the name in my passport. But
        I havenʹt used that part of my name, as an artist, for a few years now. "Habib Meftah" on its own is catchier.
      accessed: '2026-10-19'
