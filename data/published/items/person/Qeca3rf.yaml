  - value:
      text: آرش سبحانی یکی از امضاکنندگان نامۀ سی فرد مقیم خارج از کشور در تاریخ چهارم دی‌ماه در سال ۱۳۹۵
      language: fa
    qualifiers:
      point in time:
        date: '1395-10-04'
        calendar: jalali
    references:
    - source: fa.wikipedia.org-wiki-arash-sobhani
      quote: |-
        آرش سبحانی یکی از امضاکنندگان نامۀ سی فرد مقیم خارج از کشور در تاریخ چهارم دی‌ماه در سال ۱۳۹۵ (بیست و چهارم دسامبر ۲۰۱۶)، برای دونالد ترامپ رئیس‌جمهور ایالات متحده آمریکا بود که در آن ضمن قیاس حکومت جمهوری اسلامی با داعش ، از دونالد ترامپ درخواست شده تحریم‌های موجود علیه سپاه پاسداران انقلاب اسلامی و نهادهای مالی وابسته به سید علی خامنه‌ای را تشدید کند. همین‌طور در آن نامه از مواضع سختگیرانه آقای ترامپ علیه حکومت ایران استقبال شده‌بود.
      accessed: '2026-11-09'
  birth date:
  - value:
      date: '1349-10-13'
      calendar: jalali
    references:
    - source: fa.wikipedia.org-wiki-arash-sobhani
      quote: |-
        آرش سبحانی (زادهٔ ۱۳ دی ۱۳۴۹ در تهران [ ۱ ] ) خواننده و نوازندهٔ گیتار الکتریک ایرانی است. او آهنگساز ، ترانه‌سرا ، خواننده و نوازندهٔ گیتار الکتریک گروه کیوسک است و در حال حاضر ساکن شهر نیویورک آمریکا می‌باشد. سبحانی شیوه نوازندگی خود را الهام‌گرفته از تام ویتس و مارک نافلر می‌داند.
      accessed: '2026-11-09'
  - value:
      date: '1971-01-03'
    references:
    - source: en.wikipedia.org-wiki-arash_sobhani
      quote: |-
        Arash Sobhani (Persian: آرش سبحانی; born 3 January 1971 in Tehran[1]) is an Iranian musician and television host. He is the lead singer and guitarist of underground rock band Kiosk and the host of OnTen, a satirical news program that airs on VOA Persian.
      accessed: '2026-11-09'
