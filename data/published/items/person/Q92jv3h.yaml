  life event:
  - value:
      text: I chose violin because it looked more similar to electric guitar.
      language: en
    references:
    - source: www.dmcworld.net-features-mahdyar
      quote: |-
        At first it wasn’t that serious, we were learning the basics of music, practicing with easier instruments like xylophone and recorder but after a year or two our music teacher told my parents that if I still want to pursue music it’s time for me to choose an instrument and learn classical music. I liked electric guitar (because of Pink Floyd) but the teacher told my parents that I should either choose violin or piano. I chose violin because it looked more similar to electric guitar.
      accessed: '2026-11-13'
  - value:
      text: I practiced violin and studied classical music for 6 years with different private tutors
      language: en
    references:
    - source: www.dmcworld.net-features-mahdyar
      quote: |-
        I practiced violin and studied classical music for 6 years with different private tutors and then I got bored of it and went on to study middle eastern music for 4 years with another private tutor. So I can’t say it was my idea, it was a combination.
      accessed: '2026-11-13'
  - value:
      text: went on to study middle eastern music for 4 years with another private tutor.
