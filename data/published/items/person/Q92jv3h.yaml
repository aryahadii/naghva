  - value:
      text: I met few rappers through graffiti and told them I can make music for them using Iranian instruments
      language: en
    references:
    - source: www.dmcworld.net-features-mahdyar
      quote: |-
        In Iran, specially at that time, there was no such thing as “industry”. Persian hip hop was at its first days and rappers were using downloaded instrumentals from the internet. I met few rappers through graffiti and told them I can make music for them using Iranian instruments so we can come up with our own version hip hop instead of copying American hip hop. I became a well known producer quite fast and from there I went on to make other types of music such as electronic, fusion and film music.
      accessed: '2026-11-13'
  - value:
      text: selected and retouched some of the tracks that I had made throughout the years, composed some new ones
        and Seized was created.
      language: en
    references:
    - source: thequietus.com-news-mahdyar-interview-money-money
      quote: |-
        It was actually only a couple of years ago that two close friends of mine who had heard many of these unreleased tracks, started pushing me relentlessly, telling me almost every week that certain people need to hear this side of my production, so I finally sat down with a theme in mind, selected and retouched some of the tracks that I had made throughout the years, composed some new ones and Seized was created. It’s for this reason that I have to thank my friend Hirad Sab who’s one of my favorite visual artists, who’s also responsible for the creative direction of my album and directed the video for ‘Money Money’ which will come out soon. The other friend is Ash Koosha who’s one of my favorite musicians and with whom I have a lot of unreleased music that we’ve made together. I’ve actually used his voice on a couple of tracks on the album including ‘Money Money’.
      accessed: '2026-11-13'
  - value:
      text: I used my visa for Cannes festival and left Iran in 2009.
      language: en
