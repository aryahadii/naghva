  life event:
  - value:
      text: |-
        من از میان همه ی سازها فلوت را به عنوان ساز تخصصی انتخاب کردم
      language: fa
    references:
    - source: azghandi.net-pileha-psh6-k.yaghmaei6.htm-0f86fc21521d
      quote: |-
        من با پیانو شروع کردم،اما بعد از انقلاب کنسرواتوآر بسته شد و وقتی ما برگشتیم به هنرستان موسیقی دیگر معلم پیانو آنجا نبود و من از میان همه ی سازها فلوت را به عنوان ساز تخصصی انتخاب کردم و بعد گیتار را ادامه دادم.
      accessed: 2026-11-13
  - value:
      text: |-
        من با وضعیت سخت و عجیبی موفق به گرفتن مجوز آن آلبوم شدم.
      language: fa
    references:
    - source: azghandi.net-pileha-psh6-k.yaghmaei6.htm-0f86fc21521d
      quote: |-
        تمام ترانه ها با مزدا شاهانی بود و ساتگین خواهرم و کامیل برادرم، اعلا مظفری و سیروان که یکی از موزیسینهای خوب کشورمان هست، مرا واقعا یاری کردند. من با وضعیت سخت و عجیبی موفق به گرفتن مجوز آن آلبوم شدم.
      accessed: 2026-11-13
  - value:
      text: |-
        در سکوت سرد، تنها عاملی که خیلی مثبت بود، حمایتی بود که کمپانی ترانه و آقای وارطان از کارم کردند.
      language: fa
    references:
    - source: azghandi.net-pileha-psh6-k.yaghmaei6.htm-0f86fc21521d
      quote: |-
        در سکوت سرد، تنها عاملی که خیلی مثبت بود، حمایتی بود که کمپانی ترانه و آقای وارطان از کارم کردند. مورد بعد نبودن شرایط سخت ممیزی برای کار پاپ بود و این خیلی برایم تجربه ی خوبی بود که توانستم به عنوان یک موزیسین کاری را انجام بدهم که خودم دلم می خواست.
      accessed: 2026-11-13
  - value:
      text: |-
        کاوه فرزند "کوروش یغمایی" هنرمند نامدار موسیقی ایران است، او پس از مدتی زندگی در شهر ونکوور در کانادا، در نهایت به ایران بازگشت تا فعالیت های هنری خود را در آن کشور ادامه دهد.
      language: fa
    references:
    - source: ir.voanews.com-a-iran-music-yaghmaie-3465312.html-37d8fbaf5d3f
      quote: |-
        کاوه فرزند "کوروش یغمایی" هنرمند نامدار موسیقی ایران است، او پس از مدتی زندگی در شهر ونکوور در کانادا، در نهایت به ایران بازگشت تا فعالیت های هنری خود را در آن کشور ادامه دهد.
      accessed: 2026-11-13
  - value:
      text: |-
        کاوه یغمایی در این دوره با چالش های گوناگونی برای دریافت مجوز مواجه بود و به همین دلیل زمان انتشار آلبوم جدیدش طولانی شد.
      language: fa
    references:
