statements:
  name:
  - value:
      text: Shaho Andalibi
      language: en
    references:
    - source: t.me-arashfouladvand-540
      quote: 'قطعه " بُت‌چین" کنسرت صدای صلح - ۲۰۱۸ - آلبوم لاله های سرخ شعر : علی اکبر شیدا آهنگساز : علی اکبر شیدا خواننده : حوروش خلیلی سولیست اول تار : استاد مجید درخشانی سولیست دوم تار : محسن فاضلی سولیست نی : شاهو عندلیبی تنبک : سینا تیلا تنظیم برای کر و ارکستر : آرش فولادوند رهبری و سرپرستی : آرش فولادوند کارگردان : محمدرضا کلانی گروه کُر : بهار ارکستر : فیلارمونیک پاریس شرقی'
      accessed: '2026-11-21'
      locator: Artist’s original album and performance credit
