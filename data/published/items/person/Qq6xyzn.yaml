  - value:
      text: کنسرتی در سال 1371 در وین اتریش برگزار کرد.
      language: fa
    qualifiers:
      point in time:
        date: '1371'
        calendar: jalali
      place: Q448bw9
    references:
    - source: www.farhadmehrad.org-farhad-mehrad-discography-b42b4c18ab12
      quote: |-
        فرهاد پیش از دریافت مجوز برای انتشار اولین آلبوم اش پس از انقلاب، کنسرتی در سال 1371 در وین اتریش برگزار کرد. او در این کنسرت علاوه بر اجرای زنده آثار قدیمی، سه قطعه که هنوز منتشر نشده بود را برای اولین بار اجرا کرد: کوچ بنفشه ها، خیال خوشی و خواب در بیداری. این کنسرت به صورت صوتی ضبط شده است و در سال 1399 به همت امید هاشملو پس از ریمستر و پالایش صدا منتشر شد.
      accessed: '2026-11-09'
  - value:
      text: سال 1372 پس از 15 سال آلبوم جديد فرهاد،“خواب در بيداري“،مجوز انتشار دريافت كرد
      language: fa
    qualifiers:
      point in time:
        date: '1372'
        calendar: jalali
    references:
    - source: www.farhadmehrad.org-content-biography-08f467a10ae9
      quote: |-
        فرهاد در این سالها در منزل به ساخت آثار جدید مشغول بود تا اینکه بالاخره سال 1372 پس از 15 سال آلبوم جديد فرهاد،“خواب در بيداري“،مجوز انتشار دريافت كرد
      accessed: '2026-11-09'
  - value:
      text: سرانجام فرهاد برای اولین بار در ایران بعد از انقلاب در مقابل چند صد تماشاچی که سالن سینما سپیده را پر کرده بودند، روی صحنه رفت
      language: fa
    qualifiers:
      point in time:
        date: '1373-10-09'
        calendar: jalali
      place: Qhm6fzw
    references:
    - source: www.bbc.com-persian-articles-cj7gd5lp8nlo-2d3bab0dd850
      quote: |-
        مسئولان وزارت ارشاد برای صدور مجوز شرایطی مطرح کردند. از جمله این‌که هیچ‌گونه تبلیغی برای این کنسرت نشود، بلیت چاپی برای کنسرت صادر نشود، از کنسرت عکس یا فیلم برداشته نشود، ترانه «گنجشکک اشی‌مشی» خوانده نشود (بخاطر این‌که آخر ترانه آمده «کی می‌خوره؟ حاکم‌باشی») و این‌که کنسرت در شبی برگزار شود که مناسبت مذهبی باشد. نهایتا مجوز کنسرت برای جمعه ۹ دی ۱۳۷۳ که هم شب بعثت پیامبر اسلام بود و هم شب سال نوی مسیحیان، در سینما سپیده تهران صادر شد. بلیت‌ها که به قیمت ۲۵۰۰ تومان فروخته می‌شدند در کمتر از سه روز فروش رفتند. سرانجام فرهاد برای اولین بار در ایران بعد از انقلاب در مقابل چند صد تماشاچی که سالن سینما سپیده را پر کرده بودند، روی صحنه رفت، و البته گنجشکک اشی مشی را هم خواند.
      accessed: '2026-11-09'
  - value:
      text: در سال 1376 در حالی که برای اجرای اجرای کنسرت به آمریکا سفر کرده بود ،آلبوم "برف" را در این کشور ضبط و منتشر كرد
      language: fa
    qualifiers:
      point in time:
        date: '1376'
        calendar: jalali
    references:
    - source: www.farhadmehrad.org-farhad-mehrad-discography-b42b4c18ab12
      quote: |-
        پس از انتشار آلبوم "خواب در بيداري" ، با رد درخواست های فرهاد برای دریافت مجوز انتشار آلبومی جدید، او كه از انتشار آلبوم بعدي خود در ايران نااميد شده بود در سال 1376 در حالی که برای اجرای اجرای کنسرت به آمریکا سفر کرده بود ،آلبوم "برف" را در این کشور ضبط و منتشر كرد، اين آلبوم يك سال بعد در ايران نیز اجازه انتشار یافت. فرهاد در این آلبوم به سراغ اشعاری از گاندی، ابوسعید ابوالخیر، اسماعیل خویی، فریدون رهنما، ملک الشعرای بهار رفته و آهنگسازی اکثر قطعات را خود برعهده داشته است.
      accessed: '2026-11-09'
  - value:
      text: در آذرماه سال 1377 کنسرتی در هتل شهر تهران برای فرهاد ترتیب داده شد.
      language: fa
    qualifiers:
      point in time:
        date: 1377-09
        calendar: jalali
      place: Qhm6fzw
    references:
    - source: www.farhadmehrad.org-farhad-mehrad-discography-b42b4c18ab12
      quote: |-
        در آذرماه سال 1377 کنسرتی در هتل شهر تهران برای فرهاد ترتیب داده شد. این کنسرت قرار بود با ظرفیت 150 نفر در دو دوشب برگزار شود. اما متولیان امر برای هر شب بیش از 350 صندلی رزرو فروخته بودند و علاوه بر آن عده ای هم بصورت سرپا در این کنسرت حضور پیدا کردند. بلیت های این کنسرت پر حاشیه در اولین ساعات فروش تمام شد و بسیاری طرفداران به ناچار در بازار سیاه بلیت را پنج برابر قیمت واقعی خریداری کردند. با تمام این حواشی، خوشبختانه این کنسرت با کیفیت مطلوبی ضبط شد (تنها بصورت صوتی) . این تنها کنسرتی بود که فرهاد آهنگ های کتیبه و گاندی را بصورت زنده اجرا کرد.
      accessed: '2026-11-09'
  - value:
      text: از مهر ماه 1379 علائم بيماري جدي در فرهاد پدیدارشد
      language: fa
    qualifiers:
      point in time:
        date: 1379-07
        calendar: jalali
    references:
    - source: www.farhadmehrad.org-content-biography-08f467a10ae9
      quote: |-
        چندی پس از آن، فرهاد درصدد تهيه آلبومي با نام “آمين“ كه ترانه هايي از كشورها و زبانهاي مختلف را در خود جاي ميداد ،برآمد. از مهر ماه 1379 علائم بيماري جدي در فرهاد پدیدارشد، اما او از حركت بازنايستاد. آن روزها هيچ چيز جز مرگ نمي توانست او را از تهيه آلبوم “ آمين“ بازدارد ،كه بازداشت…
      accessed: '2026-11-09'
