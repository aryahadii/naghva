  - value:
      text: از سال ۴۵ همكاري فرهاد با گروه black cats در كلاب كوچيني آغاز ميشود.
      language: fa
    qualifiers:
      point in time:
        date: '1345'
        calendar: jalali
      place: Qhm6fzw
    references:
    - source: www.farhadmehrad.org-content-biography-08f467a10ae9
      quote: |-
        از سال ۴۵ همكاري فرهاد با گروه black cats در كلاب كوچيني آغاز ميشود. شهبال شب پره (پركاشن) ،شهرام شب پره (گيتار)، هامو(گيتار)،حسن شماعي زاده (ساكسيفون) و منوچهر اسلامي (ترومپت) و فرهاد به عنوان خواننده و نوازنده گیتار و پیانو.
      accessed: '2026-11-09'
  - value:
      text: پس از مدتی فرهاد، از بلک کتز جدا و برای دیدار خواهرش راهي انگلستان شد.
      language: fa
    references:
    - source: www.farhadmehrad.org-content-biography-08f467a10ae9
      quote: |-
        پس از مدتی فرهاد، از بلک کتز جدا و برای دیدار خواهرش راهي انگلستان شد. در طول سفر كه در ابتدا قرار بود 2 ماه به طول انجامد فرهاد در چند کافه لندن به اجرای برنامه مشغول می شود. در این میان يكي از تهيه كنندگان سرشناس انگليسي به سراغ او مي آيد و پيشنهاد انتشار آلبومي با صداي فرهاد را مطرح ميكند. اما فرهاد به دلایل مختلف پیگیر این پیشنهاد نمیشود و انتشار این آلبوم در حد حرف باقي میماند و سفر 2 ماهه بيش از يكسال به طول می انجامد.
      accessed: '2026-11-09'
  - value:
      text: در روز ۲۳ بهمن ۵۷، در ستایش آزادی و آزادگی از تلویزیون ملّی آن روزگار پخش شد.
      language: fa
    qualifiers:
      point in time:
        date: '1357-11-23'
        calendar: jalali
    references:
    - source: ir.voanews.com-a-farhad-mehrad-80th-birthday-7448047.html-ace61bfd7078
      quote: |-
        در زمستان ۱۳۵۷ ترانهٔ انقلابی «وحدت» معروف به «محمد» را خواند، ترانه‌ای با همکاری سیاوش کسرایی و اسفندیار منفردزاده که درست یک‌ روز بعد از انقلاب در ایران، یعنی در روز ۲۳ بهمن ۵۷، در ستایش آزادی و آزادگی از تلویزیون ملّی آن روزگار پخش شد.
      accessed: '2026-11-09'
  - value:
      text: پس از انقلاب فرهاد، از ادامه كار منع و تقاضاهاي چندباره او براي انتشار مجدد آثارش با مخالفت روبرو شد.
      language: fa
    references:
