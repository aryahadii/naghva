      quote: در سال 89 اولین آلبوم رسمی گروه به نام شیراز چل ساله که در آن طاها پارسا و امید نعمتی و سپنتا مجتهدزاده خوانندگی را بر عهده داشتند و آیدین آغداشلو و رؤیا نونهالی دکلمه‌های آلبوم را بر عهده داشتند و غزل شاکری بک وکال این آلبوم بود. گروه "دنگ‌شو" تاکنون آلبوم‌های "شیراز چل‌ساله"، "دل تنگ شو"، "اتاق گوشواره" و "مد و نای" را منتشر کرده‌اند.
