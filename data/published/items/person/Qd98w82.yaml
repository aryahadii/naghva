    - source: sixdegreesrecords.com-loga
      quote: |-
        The album features the astounding voice of Persian classical singer Khosro Ansari and draws a great amount of inspiration from traditional Iranian melodies and poetry. Loga explains, “I could not have found a better person to collaborate with other than Khosro Ansari, whose incredible voice, vocal melodies and choice of poetry became such an integral part of this expression.”
