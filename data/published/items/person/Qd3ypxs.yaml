  - value:
      text: آهنگ «۳» را برای اولین بار در سایت بیدارزنی که جای ایمنی برای همه مادرها و فرزندان مادرهاست به اشتراک می‌گذارم.
      language: fa
    references:
    - source: bidarzani.com-29300
      quote: آهنگ «۳» را برای اولین بار در سایت بیدارزنی که جای ایمنی برای همه مادرها و فرزندان مادرهاست به اشتراک می‌گذارم. این آهنگ احساسات اضطراب و بیگانگی سه ماه اول بعد از زایمان را بیان می‌کند.
      accessed: '2026-11-13'
      locator: Last paragraph before song credits
  - value:
      text: 'Seven Climes (Original: هفت اقلیم) is non-profit collaborative music project I started during Covid-19 lockdowns while I was living in Seattle.'
      language: en
    references:
    - source: www.salomemc.com-beyond
      quote: 'Seven Climes (Original: هفت اقلیم) is non-profit collaborative music project I started during Covid-19 lockdowns while I was living in Seattle. It aims to celebrate the cultural and lingual diversity that exist within the various ethnic groups from the Middle East, amplifying the voices of the marginalized youth and showcasing the power of hiphop as a tool for preserving languages and oral history.'
      accessed: '2026-11-13'
      locator: Opening paragraph
  - value:
      text: As I moved to Austin in 2023 with my family
      language: en
    references:
    - source: www.salomemc.com-beyond
      quote: As I moved to Austin in 2023 with my family, the Teasturbed project in its Seattle form ceased to exist
      accessed: '2026-11-13'
      locator: Teasturbed paragraph
    qualifiers:
      point in time:
        date: '2023'
