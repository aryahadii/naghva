  - value:
      text: آوا راستی
      language: fa
    references:
    - source: culture.univ-lille.fr-rencontre-kamakan
      quote: 'La rose des vents

        Scène nationale Lille Métropole Villeneuve d’Ascq et

        Le Grand Mix

        Scène de Musiques Actuelles Tourcoing s''associent pour accueillir en résidence Kamakan, groupe formé par l''artiste iranien
        Mehdi Saki. Ici, le projet Kamakan se réinvente en formule trio, avec des sonorités électroniques : Mehdi Saki (chant, guitare,
        percussions), Ava Rasti (basse, machines) et Axel Moon (claviers, machines, saz, rubab).'
      accessed: '2026-11-06'
