  - value:
      text: علی الماسی
      language: fa
    references:
    - source: tasnimnews.ir-1724838-this-side
      quote: کیان پور تراب ترانه سرا، آهنگساز، تنظیم کننده، نوازنده و خواننده این آلبوم است و علیرضا ریاضی (تنظیم،کیبورد، سینتی سایزر، سازهای الکترونیک)، میلاد درخشانی (سه تار)، علی الماسی و اردلان مجتبوی (گیتار الکتریک)، با او همکاری داشته اند.
      accessed: '2026-11-13'
