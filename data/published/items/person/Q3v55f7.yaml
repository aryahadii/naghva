  - value:
      text: کوروش بابایی
      language: fa
    references:
    - source: tasnimnews.ir-fa-news-1393-06-24-499128-e3b52499db82
      quote: در «اشارت نظر» گزیده‌ای از بهترین نوازندگان ایران درخشانی را همراهی کرده‌اند، نوازندگانی همچون رضا
        تاج‌بخش‌ (پیانو، کیبورد) ‌، آرش مقدم (درامز)، ‌ نیما رمضان (گیتار الکتریک)، ‌ دارا دارایی (گیتار بیس) ‌،
        یاشار خسروی (ساکسیفون)، ‌ پدرام درخشانی (سنتور)، کوروش بابایی و شروین مهاجر (کمانچه)، پاشا هنجنی‌ (نی)،
        ‌همایون نصیری (پرکاشن)، ‌علی جعفری‌، پدرام فریوسفی (ویلن) و... کیان پورتراب (خواننده گروه کامنت) هم در قطعه
        «بشنو» به عنوان خواننده مهمان حضور دارد.
      accessed: '2026-11-06'
