  - value:
      text: ماهور
      language: fa
    references:
    - source: pelakrecords.com-records-start-4
      quote: 'قیچی

        رپ کن : بامداد آهنگسازان : یارا – ماهور – مافوق – نکو ضبط ، میکس و مسترینگ : یارا عکاس و طراح
        جلد : پیام یارائی طراح دفترچه اشعار : سواد ناشر : پلاک در نظر داشته باشید این مجموعه در تاریخ
        اول آذر از طریق سرویس های مختلف استریمینگ در دسترس عموم قرار خواهد گرفت حق انتشار این مجموعه بطور
        کامل متعلق به تشکل پلاک است'
      accessed: '2026-10-19'
