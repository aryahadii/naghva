  - value:
      text: Now unable to travel to the United States, Sevdaliza turned to music to vent her frustrations as well as extend love to others with her new song “Bebin,”
      language: en
    qualifiers:
      point in time:
        date: 2017-01
    references:
    - source: www.billboard.com-articles-news-politics-7677096-iranian-dutch-singer-sevdaliza-immigration-ban-bebin
      quote: |-
        Now unable to travel to the United States, Sevdaliza turned to music to vent her frustrations as well as extend love to others with her new song “Bebin,” which means “to look” in the Persian language Farsi.
