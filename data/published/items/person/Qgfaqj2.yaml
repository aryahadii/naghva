    - source: downloads.ninjatune.net-artist-ash-koosha-a961f9814bf9
      quote: On his release—and with Font now in effect shut down—Koosha formed Take It Easy Hospital, a new indie/electronic/pop band, with friend Negar Shaghaghi. They built up a big following on myspace and, off the back of that, were invited to play the In The City Festival in Manchester. The Kurdish-Iranian film director, Bahnman Ghobadi, got in touch around the same time, asking them to collaborate with him on a film about the Iranian underground music scene.
      accessed: '2026-10-20'
