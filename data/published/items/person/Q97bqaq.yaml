    references:
    - source: siavashamini.bandcamp.com-album-tar-cf0baebdf639
      quote: Continuing his experiments combining elements of drone and modern classical music, Tehran based composer Siavash Amini`s
        4th solo LP "TAR" explores the fragile tensions between an individual and a collective subconscious. TAR is an inquiry of how
        fears and hopes of an individual can be related to a broader state of mind shared collectively. Making it`s starting point the
        expression of these feelings in dreams and nightmares of each individual, and translating the images, feelings and textures
        into sound.
      accessed: '2026-11-13'
