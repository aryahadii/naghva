  - value:
      text: he was summoned to court in 2008 on the charge of "promoting and publishing music without a license" and released on bail of 5 million tomans
      language: en
    qualifiers:
      point in time:
        date: '2008'
    references:
    - source: www.iranrights.org-library-document-4171
      quote: |-
        "Hichkas" released his first underground album, which had social and critical themes, in 2006 without permission from the Ministry of Islamic Guidance. After the album became very popular amongst the younger generation, he was summoned to court in 2008 on the charge of "promoting and publishing music without a license" and released on bail of 5 million tomans with a commitment to not sing rap songs without a license until the trial.
      accessed: '2026-11-09'
  - value:
      text: In the video for 2008′s Yeh mosht sarbaz (A bunch of soldiers) the rapper stands with his gang
      language: en
    qualifiers:
      point in time:
        date: '2008'
    references:
    - source: www.irishtimes.com-culture-music-2023-04-01-they-kill-artists-softly-the-iranian-rappers-challenging-the-state
      quote: |-
        In the video for 2008′s Yeh mosht sarbaz (A bunch of soldiers) the rapper stands with his gang, rapping about solidarity and survival in the mean streets. “The flag is flying high,” he raps, beside Iranian flags flapping in the wind. He is ready to lay down his life for “God, nation, family and friends”.
      accessed: '2026-11-09'
