  - value:
      text: recording grainy rap videos on the streets of Tehran
      language: en
    qualifiers:
      point in time:
        date: 2000/2006
      place: Qhm6fzw
    references:
    - source: www.bbc.com-culture-article-20230502-hichkas-the-song-that-became-an-iranian-protest-anthem-5f626d75b03b
      quote: |-
        In the early-to-mid 2000's, Soroush Lashkari, better known as Hichkas (the Persian word for "nobody") was recording grainy rap videos on the streets of Tehran. Since he didn't have any lighting at night, he and his friends would shoot their videos by walking in front of the tail-lights of a car driving in reverse.
      accessed: '2026-11-09'
