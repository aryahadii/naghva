  - value:
      text: In August 2009, with some poets and writers in shows of "Night of Solidarity with the liberation struggle", Najafi had a protest rock show in Stockholm, Sweden.
      language: en
    qualifiers:
      point in time:
        date: 2009-08
    references:
    - source: en.wikipedia.org-wiki-shahin_najafi-90d9d4902367
      quote: |-
        In August 2009, with some poets and writers in shows of "Night of Solidarity with the liberation struggle", Najafi had a protest rock show in Stockholm, Sweden.[29] In December 2009, coinciding with "Student Day" in Iran, Najafi with Ziba Shirazi had a protest music show at Georgetown University, Washington, D.C.
      accessed: '2026-11-09'
  - value:
      text: Following a judgment in April 2012 by Grand Ayatollah Lotfollah Safi Golpaygani
      language: en
    qualifiers:
      point in time:
        date: 2012-04
    references:
    - source: tif.ssrc.org-2015-01-16-how-to-make-someone-famous-for-the-wrong-reason
      quote: |-
        Following a judgment in April 2012 by Grand Ayatollah Lotfollah Safi Golpaygani, a senior cleric and teacher in the city of Qom (a traditional center of influential seminaries), the website Shia-Online.ir offered a $100,000 bounty on the artist’s head. On May 14, 2012, the story broke in the German and English press: The Guardian put him in the company of Sir Rushdie under the headline, “Iranian rapper faces death threats and fatwa for ‘blasphemous’ song.” Najafi went into hiding with protection from the German police.
      accessed: '2026-11-09'
