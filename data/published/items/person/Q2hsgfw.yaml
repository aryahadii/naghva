statements:
  name:
  - value:
      text: کریستف رضاعی
      language: fa
    references:
    - source: rooziato.com-201612523-far-album-65163bfa87ec
      quote: |-
        در این آلبوم «ماکان اشگواری» می‌خواند، «امیر صارمی» گیتار می‌نوازد، «سردار سرمست» نوازنده پیانو الکتریک است، «سهیل پیغمبری» کلارینت نواز و «بردیا کیارس» نوازنده ویولن آلتو و ویولن هستند. همچنین «کریستف رضاعی» تنظیم سازهای زهی را در این آلبوم به عهده دارد.
      accessed: '2026-11-06'
  - value:
      text: Christophe Rezaei
      language: en
    references:
    - source: open.spotify.com-artist-5fdmz6bt1oz2ffllrull6z-23ce44a74d1a
      quote: |-
        He is known for his albums "To Trucks", "Ba'd Boro" and "Far". And also his collaborations with Bomrani, Pallet, King Raam, Kamakan, Christophe Rezaei, Daal Band, Hamze Yegane, Sardar Sarmast, Ali Phi and Arshid Azarine.
      accessed: '2026-11-06'
