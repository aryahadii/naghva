  - value:
      text: وی ۱۸ ساله بود که پدرش از دنیا رفت
      language: fa
    references:
    - source: fa.wikipedia.org-wiki-yas-singer
      quote: |-
        وی ۱۸ ساله بود که پدرش از دنیا رفت و پس از آن به همراه خانواده‌اش زندگی سختی را در نبود پدرشان سپری کرد. یاس که فرزند بزرگ خانواده بود تحصیل خود در رشتهٔ عمران دانشگاه را نیمه‌کاره رها کرد و به سمت کار برای تأمین مخارج خانواده گام نهاد و در کنار فعالیت موسیقی به کار در شرکت بازرگانی عمویش و مسافرکشی با اتومبیل پیکان پرداخت.
      accessed: '2026-11-09'
  - value:
      text: تحصیل خود در رشتهٔ عمران دانشگاه را نیمه‌کاره رها کرد
      language: fa
    references:
    - source: fa.wikipedia.org-wiki-yas-singer
      quote: |-
        وی ۱۸ ساله بود که پدرش از دنیا رفت و پس از آن به همراه خانواده‌اش زندگی سختی را در نبود پدرشان سپری کرد. یاس که فرزند بزرگ خانواده بود تحصیل خود در رشتهٔ عمران دانشگاه را نیمه‌کاره رها کرد و به سمت کار برای تأمین مخارج خانواده گام نهاد و در کنار فعالیت موسیقی به کار در شرکت بازرگانی عمویش و مسافرکشی با اتومبیل پیکان پرداخت.
      accessed: '2026-11-09'
  - value:
      text: Yas started his work after the 2003 Bam earthquake.
      language: en
    qualifiers:
      point in time:
        date: '2003'
    references:
    - source: en.wikipedia.org-wiki-yas_-rapper-03e0bb95b0de
      quote: |-
        Yas started his work after the 2003 Bam earthquake. Devastated by the disaster, it was then, that he wrote his first song "Bam". This was the beginning of his rapping career.
      accessed: '2026-11-09'
  - value:
      text: یاس در سال ۱۳۸۵ آهنگ یادت نره را با همکاری مجید غفوری، خوانندهٔ رپ منتشر کرد.
      language: fa
    qualifiers:
      point in time:
        date: '1385'
        calendar: jalali
    references:
    - source: fa.wikipedia.org-wiki-yas-singer
      quote: |-
        یاس در سال ۱۳۸۵ آهنگ یادت نره را با همکاری مجید غفوری، خوانندهٔ رپ منتشر کرد. این اثر یکی از قطعات آلبوم نگو دیره از غفوری بود که با مجوز وزارت ارشاد اسلامی منتشر شد و بدین ترتیب این اثر نخستین آهنگ با صدای یاس شد که با مجوز رسمی نهادهای دولتی ایران منتشر شد.
      accessed: '2026-11-09'
  - value:
      text: در ۱۳۸۶ یاس در سفری شش هفته‌ای به ایالات متحده آمریکا به اجرای چندین کنسرت در این کشور پرداخت.
      language: fa
    qualifiers:
      point in time:
        date: '1386'
        calendar: jalali
    references:
    - source: fa.wikipedia.org-wiki-yas-singer
