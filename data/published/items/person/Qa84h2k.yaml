  - value:
      text: |-
        ولی به مرور که سنم بیشتر شد کم‌کم یاد گرفتم قبل از هرکاری باید همه جوانب
        را در نظر داشته باشم و به همین دلیل کم‌کم متوجه شدم شرایط جدی است و بعد
        از آن خیلی تلاشی نکردم در جهت این که بخواهم اجرای زنده داشته باشم.
      language: fa
    references:
