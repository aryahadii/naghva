      text: آرش رئیسی
      language: fa
    references:
    - source: t.me-jalboat-435
      quote: |-
        اعضای گروه جالبوت ؛ محمدعلی ذاکری قشمی (خواننده)، حامد حمیدزاده (گیتارباس)، محسن خاش (پرکاشن)، آیدین رادکیا (درامز)، آرش رئیسی (گیتار کلاسیک)، آرشام غفوری (گیتار الکتریک)، آرین ملکیان (کیبورد و پیانو)، هومان عمادی (گیتار الکتریک).
      accessed: '2026-10-19'
