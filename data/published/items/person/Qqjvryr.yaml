  - value:
      text: حضور در سه فیلم کوتاه سینمای آزاد آن سال ها به کارگردانی حسن بنی هاشمی به عنوان بازیگر و دریافت جایزه
        ی اول سینمای آزاد برای فیلم نهنگ که نویسنده ی آن نیز خود منصفی بود اشتهار دوچندان او را فراهم کرد.
      language: fa
