  - value:
      text: عليرضا كُليايى
      language: fa
    references:
    - source: t.me-halehseyfizadeh-146
      quote: 'شَهْر خاليست

        ملودى و آواز :هاله سيفى زاده

        تنظيم :امير محمّد نَظَر

        به استقبالِ غزلى از حضرت ِ حافظ

        شاعر :عليرضا كُليايى

        اين اثر به صورت آنسامبل ضبط شده است

        بهارِ ١٣٩٩

        @halehseyfizadeh'
      accessed: '2026-11-06'
