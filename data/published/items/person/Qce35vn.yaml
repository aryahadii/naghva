      quote: |-
        لوگا رامین ترکیان نوازنده، آهنگساز و از اعضای «نیاز» در گفتگو با بهنود مکری درباره این گروه موسیقی تلفیقی، آلبوم جدید و کنسرت چند رسانه ای نیاز توضیحاتی داد.
      accessed: '2026-10-19'
