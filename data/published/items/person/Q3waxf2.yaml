  - value:
      text: سهیل پیغمبری
      language: fa
    references:
    - source: rooziato.com-201612523-far-album-65163bfa87ec
      quote: در این آلبوم «ماکان اشگواری» می‌خواند، «امیر صارمی» گیتار می‌نوازد، «سردار سرمست» نوازنده پیانو الکتریک است، «سهیل پیغمبری»
        کلارینت نواز و «بردیا کیارس» نوازنده ویولن آلتو و ویولن هستند. همچنین «کریستف رضاعی» تنظیم سازهای زهی را در این آلبوم به عهده
        دارد.
      accessed: '2026-11-06'
