  name:
  - value:
      text: مهدی ساکی
      language: fa
    references:
    - source: tasnimnews.ir-1383459-dee518db37cf
      quote: علی زندوکیلی، محسن شریفیان، مهدی ساکی، رضا کولغانی و... از دیگر چهره‌هایی بودند که در مقاطع مختلف با دارکوب همکاری کرده‌اند.
      accessed: '2026-10-19'
  - value:
      text: Mehdi Saki
      language: en
    references:
    - source: www.vaakrecords.com-events-kamakan-live-in-london-a-fusion-of-iranian-folk-and-electronic-soundscapes-8d31bfec0cea
      quote: Hailing from Ahwaz, Mehdi Saki was immersed in Arabic lullabies from a young age, finding solace in dance and music amid the turmoil of war.
        After studying dance and theatre in Tehran, he formed Kamakan, a contemporary folk project that brings together musicians from the independent scene.
      accessed: '2026-10-19'
  member of:
  - value: Q6vgcdn
    qualifiers:
      role:
      - vocals
      - guitar
      - percussion
    references:
    - source: www.vaakrecords.com-events-kamakan-live-in-london-a-fusion-of-iranian-folk-and-electronic-soundscapes-8d31bfec0cea
      quote: Following a residency at Le Grand Mix in France in November 2023, Kamakan – with Mehdi Saki (vocals, guitar, percussion), Ava Rasti (bass,
        electronic machines), and Axel Moon (saz, rabab, electronic machines) – has embraced electronic sounds to offer audiences a fresh and immersive
        experience.
      accessed: '2026-10-19'
  birth date:
  - value:
      date: '1974'
    references:
    - source: raseef22.net-article-1087519-saki
      quote: ولد مهدي عام 1974 في الأهواز، مثّل في عدة أفلام ومسرحيات، وإلى ‏جانب موهبة التمثيل فقد مارس الغناء على طريقة "موسیقی الفیوجن" ‏ضمن فرقته الغنائية
        (كَمَاكان). يغني مهدي ‏بأسلوبه الجميل باللغتين العربية والفارسية أغانيَ فولكلورية إلى جانب قصائد عدة لجلال الدين الرومي، كما يعمل في معظم أغانيه
        على مزج الأغاني العربية ‏والفارسية بتوزيع جديد وآلات موسيقية غربية.
      accessed: '2026-11-06'
