  - value:
      text: Arash Zarabi
      language: en
    references:
    - source: www.silkroadsongbook.com-bios-67de5b65e7cd
      quote: |-
        Arash Zarabi is a music composer, double bass player, performer and film score composer based in Tehran. He started his musical journey playing the double bass in different classical orchestras including the Tehran Symphony Orchestra, Iran’s National Orchestra, and Iran-Austria (AISO). At the moment, he is exploring new influences in his music by incorporating jazz, folk, soul, and alternative.
      accessed: '2026-10-19'
  - value:
      text: ضربی
      language: fa
    references:
    - source: podcasts.apple.com-us-podcast-e1-s3--d8-a2-d8-b1-d8-b4--d8-b6-d8-b1-d8-a7-d8-a8-db-8c-arash-zarabi-id177119021-2836f1da998b
      quote: |-
        آرش که اسم «ضربی» رو برای فعالیت هنریش انتخاب کرده، از مسیر پر فراز و نشیبش از هنرستان موسیقی تا استودیوهای مستقل و شکل گیری گروه نینجاهای بدشانس میگه.
      accessed: '2026-10-19'
