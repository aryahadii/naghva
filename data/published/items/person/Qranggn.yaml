  - value:
      text: به ژنو رفتم تا با بوگدانوویچ کار کنم.
      language: fa
    references:
    - source: babakvalipour.com-wp-content-uploads-2014-10-golfam-khayam-interview.pdf
      quote: به ژنو رفتم تا با بوگدانوویچ کار کنم.
      accessed: '2026-11-13'
      locator: Printed p43, same answer, left column
  - value:
      text: بوگدانوویچ از من خواست که منابعی از موسیقی ایرانی در اختیارش بگذارم، من هم چند سی.دی. و کتاب ردیف موسیقی
        ایرانی را به او دادم.
      language: fa
    references:
    - source: babakvalipour.com-wp-content-uploads-2014-10-golfam-khayam-interview.pdf
      quote: بوگدانوویچ از من خواست که منابعی از موسیقی ایرانی در اختیارش بگذارم، من هم چند سی.دی. و کتاب ردیف موسیقی
        ایرانی را به او دادم. هر قطعه را براساس یک مینیاتور نوشت که عنوان قطعات هم از همین مینیاتورها گرفته شده
        است.
      accessed: '2026-11-13'
      locator: Printed p46, left column, question about writing Persian pieces
