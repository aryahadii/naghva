  - value:
      text: پروژه «پرواز ليلي» كاملا آهنگسازي شده بود و در اجرا هم مي‌دانستم كه از كجا به كجا مي‌روم.
      language: fa
    references:
    - source: www.sarpoosh.com-art-cinema-music-music970603686.html
      quote: پروژه «پرواز ليلي» كاملا آهنگسازي شده بود و در اجرا هم مي‌دانستم كه از كجا به كجا مي‌روم. اساسا عنصر
        بداهه در اجرا بسيار كم بود.
      accessed: '2026-11-13'
      locator: Question whether project was improvised, answer opening
