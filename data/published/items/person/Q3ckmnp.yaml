statements:
  name:
  - value:
      text: Negar Shaghaghi
      language: en
    references:
    - source: iranian.com-main-music-take-it-easy-hospital.html-2d86ea766883
      quote: |-
        Negar Shaghaghi ( Nelle ) was persuing dreams of her own at that time. She began singing indipendently at a very young age without having a professional vocal coach. She grew up trying to realize her old dream, She also found a poetic side in herself and wrote several short stories and poems. later she tried to cover songs by great female artists and improved her vocal techniques, also wrote lyrics of her own circling mainly on social concerns and her own feelings and other people's.
      accessed: '2026-10-20'
  member of:
  - value: Q7k5kmw
    references:
    - source: downloads.ninjatune.net-artist-ash-koosha-a961f9814bf9
      quote: |-
        On his release—and with Font now in effect shut down—Koosha formed Take It Easy Hospital, a new indie/electronic/pop band, with friend Negar Shaghaghi. They built up a big following on myspace and, off the back of that, were invited to play the In The City Festival in Manchester. The Kurdish-Iranian film director, Bahnman Ghobadi, got in touch around the same time, asking them to collaborate with him on a film about the Iranian underground music scene.
      accessed: '2026-10-20'
