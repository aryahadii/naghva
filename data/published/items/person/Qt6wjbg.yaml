  name:
  - value:
      text: Mohsen Namjoo
      language: en
    references:
    - source: www.mohsennamjoo.com-bio-5245eac68977
      quote: |-
        Born in 1976 in Khorasan province, one of epicenters of poetry and music north east of Iran, Mohsen Namjoo is a Singer Songwriter, Music scholar and Setar (traditional Persian lute) player currently based in New York City.
      accessed: '2026-10-19'
  - value:
      text: محسن نامجو
      language: fa
    references:
    - source: www.radiofarda.com-a-mohsen-namjoo-iv-motantan-30477486.html-bfb91701084d
      quote: |-
        «مطنطن» نام آلبوم جدید محسن نامجو است. این آلبوم مجموعه‌های از ساخته‌های این خواننده را در بر می‌گیرد که بین سال‌های ۷۵ تا ۹۸ نوشته و ساخته شده‌اند.
      accessed: '2026-10-19'
