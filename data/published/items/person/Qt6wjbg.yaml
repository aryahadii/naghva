    references:
    - source: insights.niacouncil.org-p-mohsen-namjoo-returns-to-iran-as
      quote: |-
        Namjoo announced his decision in a video released Thursday, saying the message would become public when he was either on his flight to Tehran or had already arrived. He said that at this stage of his life, being in his homeland and close to family and friends mattered more than whether he would be allowed to resume his musical or cultural work.
