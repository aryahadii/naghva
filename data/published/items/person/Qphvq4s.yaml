      quote: I am an Iranian singer, composer, songwriter, pianist, and vocal coach specializing in rock and metal music.
        Born on July 16, 1978, in Tehran, Iran, my musical journey began with learning Persian folk music as a child.
        I later expanded my skills to classical piano, vocals, and solfeggio.
