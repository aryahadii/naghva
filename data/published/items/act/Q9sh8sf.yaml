  - value:
      text: Vas
      language: en
    references:
    - source: www.allmusic.com-artist-vas-mn0000312179-f06693b11412
      quote: Ethnic fusion duo Vas are comprised of Iranian-born vocalist Azam Ali and American percussionist Greg Ellis; after issuing their debut, Sunyata, in 1997, they resurfaced the following year with Offerings.
      accessed: '2026-11-06'
  - value:
      text: واس
      language: fa
    references:
    - source: www.radiofarda.com-a-1136151.html-1e1c92db8867
      quote: 'اعظم علي خواننده ايراني تبار و يكي از بنيانگذاران گروه «واس» در مصاحبه با راديو آزادي مي گويد: از چهارسالگي در هند بزرگ شده و تا پانزده سال پيش هم در هند درس خوانده است. كار او تاثيري از موسيقي ايران و هند، موسيقي قرون وسطي را نشان مي دهد. وي نزد استاد منوچهر صادقي سنتور ياد گرفت. مي گويد عاشق كارهاي حسين عليزاده و سيما بيناست. در سه آلبومي كه گروه واس منتشر كرده است تنها يك قطعه با كلام مولوي خوانده است، بقيه كارهاي گروه موسيقي فاقد كلام است. وي مي گويد: كلام قادر به بيان احساسات او نيست. به دليل اينكه از كودكي با زبان هاي مختلف برخورد كرده، و گاهي قادر نبود معني آوازهايي را كه مي شنيد دريابد، به موسيقي آوايي بدون كلام علاقمند شده، در موسيقي هند و ايران يك نوع اشتياق هست. '
      accessed: '2026-11-06'
