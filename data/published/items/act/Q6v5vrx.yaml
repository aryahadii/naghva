      accessed: '2026-11-13'
  - value:
      text: در سال 1391 پس از 12 سال سرانجام مجوز فعالیت گروه در ایران توسط وزارت ارشاد صادر شده و اولین آلبوم رسمی
        گروه در ایران با نام "این خرقه بیانداز" با اعضای جدید و جوان گروه (نیما رمضان، روزبه قلیپور، پویا شمالی
        و سامان وندادی) ضبط و منتشر شد
      language: fa
    references:
    - source: www.ohum.online-content-about.htm-f0c1f618e8c5
      quote: |-
        در سال 1391 پس از 12 سال سرانجام مجوز فعالیت گروه در ایران توسط وزارت ارشاد صادر شده و اولین آلبوم رسمی گروه در ایران با نام "این خرقه بیانداز" با اعضای جدید و جوان گروه (نیما رمضان، روزبه قلیپور، پویا شمالی و سامان وندادی) ضبط و منتشر شد
      accessed: '2026-11-13'
  - value:
      text: در پائیز 1400 اوهام شروع به کار بروی آلبوم جدید خود نمود که این اولین همکاری مجدد اعضای گروه در یک آلبوم
        کامل پس از دو دهه فاصله بود. مانند اولین آلبوم اوهام، ضبط آلبوم جدید فقط با حضور شهرام، بابک و شاهرخ انجام
        شد (که شاهرخ ایزدخواه پارت های گیتار را در ونکوور کانادا ضبط و ارسال نمود).
      language: fa
    references:
    - source: www.ohum.online-content-about.htm-f0c1f618e8c5
      quote: |-
        در پائیز 1400 اوهام شروع به کار بروی آلبوم جدید خود نمود که این اولین همکاری مجدد اعضای گروه در یک آلبوم کامل پس از دو دهه فاصله بود. مانند اولین آلبوم اوهام، ضبط آلبوم جدید فقط با حضور شهرام، بابک و شاهرخ انجام شد (که شاهرخ ایزدخواه پارت های گیتار را در ونکوور کانادا ضبط و ارسال نمود).
      accessed: '2026-11-13'
  - value:
      text: 'در شهریور سال 1403 اوهام نسخه دوم از فعالیت خود را نیز آغاز کرد: آثاری از گروه که با اشعاری غیر از
        حضرت حافظ و موزیکی متفاوت تر از قبل تولید می شوند با نام اوهام ورژن دو و لوگوی خاص آن منتشر می گردند. تا
        کنون سه تک آهنگ از ورژن دوم اوهام تولید و منتشر شده است.'
      language: fa
    references:
    - source: www.ohum.online-content-about.htm-f0c1f618e8c5
      quote: |-
        در شهریور سال 1403 اوهام نسخه دوم از فعالیت خود را نیز آغاز کرد: آثاری از گروه که با اشعاری غیر از حضرت حافظ و موزیکی متفاوت تر از قبل تولید می شوند با نام اوهام ورژن دو و لوگوی خاص آن منتشر می گردند. تا کنون سه تک آهنگ از ورژن دوم اوهام تولید و منتشر شده است.
      accessed: '2026-11-13'
