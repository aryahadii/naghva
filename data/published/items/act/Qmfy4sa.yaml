  - value:
      text: Nederlands Blazers Ensemble
      language: en
    references:
    - source: nbe.nl-shop-bach-sufi
      quote: Zoals het soefisme aanspoort tot eenheid en harmonie, en oosters en westers gedachtegoed met elkaar verbindt, zo omarmen traditionele Perzische muziek en Johann Sebastian Bach elkaar in dit programma. Samen met de Iraanse zangeres Haleh Seyfizadeh, de Iraanse tärspeler Ali Ghamsari, de Nederlandse theorbe-virtuoos David Mackor en de Canadese sopraan Elisabeth Hetherington, brengt het Nederlands Blazers Ensemble een oriëntaalse Bach in innige omhelzing met oude Perzische muziek ten gehore. De verbindende muziek is van de hand van componist Mathilde Wantenaar, die zich onderscheidde tijdens de compositiewedstrijden van het NBE door diepgang en engagement.
      accessed: '2026-11-06'
