id: Q4c28kf
type: act
statements:
  name:
  - value:
      text: Kahtmayan
      language: en
    references:
    - source: iranian.com-kahtmayan
      quote: |-
        Kahtmayan started in January 2003 in Iran, although much of the music was written by Homayoon Majdzadeh (guitarist) before that time.
      accessed: '2026-10-19'
  - value:
      text: کَهت‌مَیان
      language: fa
    references:
    - source: ihtmusic.iht-group.ir-ms-artists-kahtmayan-0d5b0ab9dd44
      quote: |-
        کَهت‌مَیان یک گروه موسیقی پراگرسیو متال است که در سال ۱۳۸۱ توسط همایون مجدزاده، نوازنده گیتارالکتریک تشکیل شد، و با پیوستن اردوان انزابی‌پور، نوازنده گیتار باس، خالد سندزاده نوازنده درام و علی خدادوست نوازنده کیبرد به صورت رسمی شروع به کار کرد.
      accessed: '2026-10-19'
