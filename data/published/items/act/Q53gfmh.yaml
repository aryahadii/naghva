  name:
  - value:
      text: Hypernova
      language: en
    references:
    - source: beehy.pe-king-raam-day-will-come-iran-acbb869b26bd
      quote: The frontman of New York-based post-punk band Hypernova, which was born in the undergrounds of Tehran in the early 2000’s, embarked on his solo career as “King Raam” in 2011 by releasing “Songs of the Wolves” and changing his style into a softer acoustic rock.
      accessed: '2026-10-19'
  - value:
      text: هایپرنوا
      language: fa
    references:
    - source: www.sbs.com.au-language-persian-fa-podcast-episode-king-raam-interview-k8tn3qcyl-d8f4c6fd81a4
      quote: او که بیشتر از آهنگ‌ساز خود را «داستان‌گو» معرفی می‌کند، فعالیت خودش را در سال ۲۰۰۰ در گروهی به اسم هایپرنوا شروع کرد، از ایران خارج شد و با اسم «کینگ رام» دوباره به ایران برگشت.
      accessed: '2026-10-19'
